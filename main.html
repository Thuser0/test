<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Main</title>
  <style>
    :root {
      --bg: #0f1419;
      --fg: #e7ecf3;
      --muted: #9aa7b5;
      --accent: #3d9cf0;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      font-family: "Segoe UI", system-ui, sans-serif;
      color: var(--fg);
      background:
        radial-gradient(ellipse 80% 60% at 20% 10%, #1a2a3a 0%, transparent 55%),
        radial-gradient(ellipse 70% 50% at 90% 90%, #152033 0%, transparent 50%),
        var(--bg);
    }

    main {
      max-width: 36rem;
      padding: 2rem;
      text-align: center;
    }

    h1 {
      margin: 0 0 0.75rem;
      font-size: 2rem;
      font-weight: 650;
      letter-spacing: -0.02em;
    }

    p {
      margin: 0 0 1.5rem;
      color: var(--muted);
      line-height: 1.5;
    }

    a {
      display: inline-block;
      padding: 0.75rem 1.25rem;
      color: #061018;
      background: var(--accent);
      text-decoration: none;
      font-weight: 600;
      border-radius: 0.5rem;
    }

    a:hover {
      filter: brightness(1.08);
    }
  </style>
</head>
<body>
  <main>
    <h1>Main</h1>
    <p>Откройте DevTools и перейдите на защищённую страницу — при обнаружении инструментов разработчика произойдёт редирект обратно сюда.</p>
    <a href="2.html">Перейти на 2.html</a>
  </main>
</body>
</html>
